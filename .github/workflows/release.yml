name: Release

on:
  push:
    tags:
      - v*

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  BINARY_NAME: unifiler
  CGO_ENABLED: "0"
  CMD_NAME: .
  GO_VERSION: "1.25.7"
  GIT_TAG: ${{ github.ref_name }}

jobs:
  build:
    name: Build
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    steps:
      - name: Checkout Code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Install Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false

      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          # In order:
          # * Module download cache
          # * Build cache (Linux)
          # * Build cache (Mac)
          # * Build cache (Windows)
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
            ~/Library/Caches/go-build
            ~\AppData\Local\go-build
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-

      - name: Install zstd (MacOS)
        if: matrix.os == 'macos-latest'
        run: brew install zstd

      - name: Create build output directories
        shell: bash
        run: mkdir -p ./build/amd64 ./build/arm64 ./build/386

      - name: Get Git Info
        shell: bash
        run: |
          echo "GIT_COMMIT=$(git rev-parse HEAD)" >> $GITHUB_ENV
          echo "GIT_DATE=$(git log -n1 --pretty='format:%cd' --date=format:'%Y%m%d')" >> $GITHUB_ENV
          echo "GIT_BRANCH=$(git rev-parse --abbrev-ref HEAD)" >> $GITHUB_ENV

      # ==============================
      #   Build & Compress Binaries
      # ==============================

      - name: Build & Compress (Linux AMD64)
        if: matrix.os == 'ubuntu-latest'
        run: |
          GOOS=linux GOARCH=amd64 go build \
            -trimpath \
            -ldflags "-s -w -X github.com/tforceaio/tf-unifiler/engine.gitCommit=$GIT_COMMIT -X github.com/tforceaio/tf-unifiler/engine.gitDate=$GIT_DATE -X github.com/tforceaio/tf-unifiler/engine.gitBranch=$GIT_BRANCH" \
            -o ./build/amd64/$BINARY_NAME $CMD_NAME
          tar -cf - -C ./build/amd64 $BINARY_NAME | zstd -o ./build/amd64/$BINARY_NAME-$GIT_TAG-linux-amd64.tar.zst

      - name: Build & Compress (Linux ARM64)
        if: matrix.os == 'ubuntu-latest'
        run: |
          GOOS=linux GOARCH=arm64 go build \
            -trimpath \
            -ldflags "-s -w -X github.com/tforceaio/tf-unifiler/engine.gitCommit=$GIT_COMMIT -X github.com/tforceaio/tf-unifiler/engine.gitDate=$GIT_DATE -X github.com/tforceaio/tf-unifiler/engine.gitBranch=$GIT_BRANCH" \
            -o ./build/arm64/$BINARY_NAME $CMD_NAME
          tar -cf - -C ./build/arm64 $BINARY_NAME | zstd -o ./build/arm64/$BINARY_NAME-$GIT_TAG-linux-arm64.tar.zst

      - name: Build & Compress (MacOS AMD64)
        if: matrix.os == 'macos-latest'
        run: |
          GOOS=darwin GOARCH=amd64 go build \
            -trimpath \
            -ldflags "-s -w -X github.com/tforceaio/tf-unifiler/engine.gitCommit=$GIT_COMMIT -X github.com/tforceaio/tf-unifiler/engine.gitDate=$GIT_DATE -X github.com/tforceaio/tf-unifiler/engine.gitBranch=$GIT_BRANCH" \
            -o ./build/amd64/$BINARY_NAME $CMD_NAME
          tar -cf - -C ./build/amd64 $BINARY_NAME | zstd -o ./build/amd64/$BINARY_NAME-$GIT_TAG-macos-amd64.tar.zst

      - name: Build & Compress (MacOS ARM64)
        if: matrix.os == 'macos-latest'
        run: |
          GOOS=darwin GOARCH=arm64 go build \
            -trimpath \
            -ldflags "-s -w -X github.com/tforceaio/tf-unifiler/engine.gitCommit=$GIT_COMMIT -X github.com/tforceaio/tf-unifiler/engine.gitDate=$GIT_DATE -X github.com/tforceaio/tf-unifiler/engine.gitBranch=$GIT_BRANCH" \
            -o ./build/arm64/$BINARY_NAME $CMD_NAME
          tar -cf - -C ./build/arm64 $BINARY_NAME | zstd -o ./build/arm64/$BINARY_NAME-$GIT_TAG-macos-arm64.tar.zst

      - name: Build & Compress (Windows AMD64)
        if: matrix.os == 'windows-latest'
        run: |
          $env:GOOS="windows"; $env:GOARCH="amd64"
          go build `
            -trimpath `
            -ldflags "-s -w -X github.com/tforceaio/tf-unifiler/engine.gitCommit=$env:GIT_COMMIT -X github.com/tforceaio/tf-unifiler/engine.gitDate=$env:GIT_DATE -X github.com/tforceaio/tf-unifiler/engine.gitBranch=$env:GIT_BRANCH" `
            -o ./build/amd64/$env:BINARY_NAME.exe $env:CMD_NAME
          Compress-Archive -Path ./build/amd64/$env:BINARY_NAME.exe -DestinationPath ./build/amd64/$env:BINARY_NAME-$env:GIT_TAG-windows-amd64.zip

      - name: Build & Compress (Windows ARM64)
        if: matrix.os == 'windows-latest'
        run: |
          $env:GOOS="windows"; $env:GOARCH="arm64"
          go build `
            -trimpath `
            -ldflags "-s -w -X github.com/tforceaio/tf-unifiler/engine.gitCommit=$env:GIT_COMMIT -X github.com/tforceaio/tf-unifiler/engine.gitDate=$env:GIT_DATE -X github.com/tforceaio/tf-unifiler/engine.gitBranch=$env:GIT_BRANCH" `
            -o ./build/arm64/$env:BINARY_NAME.exe $env:CMD_NAME
          Compress-Archive -Path ./build/arm64/$env:BINARY_NAME.exe -DestinationPath ./build/arm64/$env:BINARY_NAME-$env:GIT_TAG-windows-arm64.zip

      # ==============================
      #   Upload artifacts
      # ==============================

      - name: Upload Artifacts (Linux AMD64)
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        if: matrix.os == 'ubuntu-latest'
        with:
          name: linux-amd64
          path: ./build/amd64/${{ env.BINARY_NAME }}-${{ env.GIT_TAG }}-linux-amd64.tar.zst

      - name: Upload Artifacts (Linux ARM64)
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        if: matrix.os == 'ubuntu-latest'
        with:
          name: linux-arm64
          path: ./build/arm64/${{ env.BINARY_NAME }}-${{ env.GIT_TAG }}-linux-arm64.tar.zst

      - name: Upload Artifacts (Linux 386)
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        if: matrix.os == 'ubuntu-latest'
        with:
          name: linux-386
          path: ./build/386/${{ env.BINARY_NAME }}-${{ env.GIT_TAG }}-linux-386.tar.zst

      - name: Upload Artifacts (MacOS AMD64)
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        if: matrix.os == 'macos-latest'
        with:
          name: macos-amd64
          path: ./build/amd64/${{ env.BINARY_NAME }}-${{ env.GIT_TAG }}-macos-amd64.tar.zst

      - name: Upload Artifacts (MacOS ARM64)
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        if: matrix.os == 'macos-latest'
        with:
          name: macos-arm64
          path: ./build/arm64/${{ env.BINARY_NAME }}-${{ env.GIT_TAG }}-macos-arm64.tar.zst

      - name: Upload Artifacts (Windows AMD64)
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        if: matrix.os == 'windows-latest'
        with:
          name: windows-amd64
          path: ./build/amd64/${{ env.BINARY_NAME }}-${{ env.GIT_TAG }}-windows-amd64.zip

      - name: Upload Artifacts (Windows ARM64)
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        if: matrix.os == 'windows-latest'
        with:
          name: windows-arm64
          path: ./build/arm64/${{ env.BINARY_NAME }}-${{ env.GIT_TAG }}-windows-arm64.zip

      - name: Upload Artifacts (Windows 386)
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        if: matrix.os == 'windows-latest'
        with:
          name: windows-386
          path: ./build/386/${{ env.BINARY_NAME }}-${{ env.GIT_TAG }}-windows-386.zip

  release:
    name: Release
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      # ==============================
      #   Download Artifacts
      # ==============================

      - name: Download Artifacts (Linux AMD64)
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6.0.0
        with:
          name: linux-amd64
          path: .

      - name: Download Artifacts (Linux ARM64)
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6.0.0
        with:
          name: linux-arm64
          path: .

      - name: Download Artifacts (Linux 386)
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6.0.0
        with:
          name: linux-386
          path: .

      - name: Download Artifacts (MacOS AMD64)
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6.0.0
        with:
          name: macos-amd64
          path: .

      - name: Download Artifacts (MacOS ARM64)
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6.0.0
        with:
          name: macos-arm64
          path: .

      - name: Download Artifacts (Windows AMD64)
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6.0.0
        with:
          name: windows-amd64
          path: .

      - name: Download Artifacts (Windows ARM64)
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6.0.0
        with:
          name: windows-arm64
          path: .

      - name: Download Artifacts (Windows 386)
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6.0.0
        with:
          name: windows-386
          path: .

      # ==============================
      #   Create Release
      # ==============================

      - name: Create Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          body: |
            "Created by Github Actions"
          draft: true
          prerelease: false
          fail_on_unmatched_files: true
          files: |
            ./${{ env.BINARY_NAME }}-${{ github.ref_name }}-linux-amd64.tar.zst
            ./${{ env.BINARY_NAME }}-${{ github.ref_name }}-linux-arm64.tar.zst
            ./${{ env.BINARY_NAME }}-${{ github.ref_name }}-linux-386.tar.zst
            ./${{ env.BINARY_NAME }}-${{ github.ref_name }}-macos-amd64.tar.zst
            ./${{ env.BINARY_NAME }}-${{ github.ref_name }}-macos-arm64.tar.zst
            ./${{ env.BINARY_NAME }}-${{ github.ref_name }}-windows-amd64.zip
            ./${{ env.BINARY_NAME }}-${{ github.ref_name }}-windows-arm64.zip
            ./${{ env.BINARY_NAME }}-${{ github.ref_name }}-windows-386.zip
